[project]
name = "agent-os"
version = "0.1.0"
description = "AgentOS Core: modular AI agent kernel"
authors = [
    {name = "AgentOS Team", email = "dev@example.com"}
]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph",
    "litellm",
    "fastapi",
    "uvicorn[standard]",
    "docker",
    "pydantic>=2",
    "typer",
    "rich",
    "python-dotenv",
    "httpx",
    "aiohttp",
    "beautifulsoup4",
    "pyyaml",
    "aider-chat>=0.60.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "email-validator",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "sentence-transformers",
    "PyJWT",
    "sentry-sdk>=2.0",
    "trafilatura>=2.0.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "performance: Performance tests and benchmarks",
]
# Test suites intentionally excluded from the default pytest run.
# See `todo-tasks.md` (root) for the canonical task tracker and the
# rationale per directory/file. Each path below is either superseded by
# the PRD10 acceptance suite (`tests/integration/api/test_prd10_*` and
# `tests/integration/api/prd10/`) or requires external infrastructure
# (live LLM, Aider CLI binary, raw socket WebSocket fixtures, SMTP relay,
# real Postgres / Redis) that V1 acceptance does not rely on.
#
# Re-include any specific path explicitly with `pytest <path>` when you
# need to inspect it (the ignore list does not delete the files).
addopts = "--ignore=tests/legacy --ignore=tests/temp --ignore=tests/e2e --ignore=tests/performance --ignore-glob=tests/integration/test_aider*.py --ignore=tests/integration/test_full_aider_adapter.py --ignore=tests/integration/test_garden_api.py --ignore-glob=tests/integration/test_websocket*.py --ignore-glob=tests/integration/test_ws*.py --ignore=tests/integration/test_webio_methods.py --ignore=tests/integration/test_observability.py --ignore=tests/integration/test_server_api.py --ignore=tests/integration/test_server.py --ignore=tests/integration/test_llm.py --ignore=tests/integration/test_ai_agent.py --ignore=tests/integration/test_tool_calling.py --ignore=tests/integration/test_diff_service.py --ignore=tests/integration/test_repo_map.py --ignore=tests/integration/test_app.py --ignore=tests/integration/test_connection_engine.py --ignore=tests/integration/workflows/test_card_workflow.py --ignore=tests/integration/workflows/test_rag_workflow.py --ignore=tests/integration/workflows/test_search_workflow.py --ignore=tests/unit/auth/test_mailer.py --ignore=tests/unit/models/test_agent_models.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src/agent_os"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
