# AgentOS Quick Start Docker Compose
# 快速启动配置 - 适合前端开发者和快速测试

version: '3.8'

services:
  # AgentOS API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agentos-api
    ports:
      - "8000:8000"  # API端口
      - "8003:8003"  # WebSocket端口

    environment:
      # 数据库配置 (使用SQLite，无需额外配置)
      - DATABASE_URL=sqlite+aiosqlite:///./data/agentos.db

      # API配置
      - API_KEY=dev-api-key
      - BASE_URL=http://localhost:8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000

      # 环境配置
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - DEBUG=true

      # LLM配置 (可选，用于AI功能)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - agentos-network

networks:
  agentos-network:
    driver: bridge
