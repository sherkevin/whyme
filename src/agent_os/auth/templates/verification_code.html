<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
        }
        .greeting {
            font-size: 16px;
            color: #333333;
            margin-bottom: 20px;
        }
        .code-box {
            background-color: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 30px 0;
        }
        .code {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
        }
        .info {
            color: #666666;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
        }
        .warning {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 20px;
            padding: 15px;
            background-color: #fee;
            border-radius: 4px;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 验证码</h1>
        </div>

        <div class="content">
            <p class="greeting">您好，</p>

            <p class="greeting">您的验证码是：</p>

            <div class="code-box">
                <div class="code">{{ code }}</div>
            </div>

            <div class="info">
                <p>该验证码 <strong>5 分钟内有效</strong>，请勿泄露给他人。</p>
                <p>如非本人操作，请忽略此邮件。</p>
            </div>

            <div class="warning">
                ⚠️ 请勿将验证码告知他人，包括客服人员。
            </div>
        </div>

        <div class="footer">
            <p>此邮件由系统自动发送，请勿直接回复。</p>
            <p>&copy; {{ year }} {{ app_name }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
