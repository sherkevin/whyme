<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentOS Studio - Login</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --accent-primary: #007acc;
            --accent-hover: #1c97ea;
            --accent-light: #3794ff;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --text-active: #ffffff;
            --border-color: #3c3c3c;
            --success-color: #4ec9b0;
            --error-color: #f14c4c;
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #0d1418 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at center, rgba(0, 122, 204, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Card */
        .card {
            background: rgba(37, 37, 38, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-active);
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent-primary);
            color: white;
        }

        /* Form */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 204, 0.2);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
            transform: none;
            box-shadow: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 16px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
        }

        .social-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .footer a {
            color: var(--accent-light);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-color: var(--success-color);
        }

        .toast.error {
            border-color: var(--error-color);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <div class="logo-icon">🚀</div>
                <h1>AgentOS Studio</h1>
                <p>AI-Powered Development Environment</p>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Login</div>
                <div class="tab" onclick="switchTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input
                        type="text"
                        id="login-username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                    <div class="error-message" id="login-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <div class="error-message" id="login-password-error"></div>
                </div>

                <button type="submit" class="btn" id="login-btn">
                    <span id="login-btn-text">Sign In</span>
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn" onclick="guestLogin()">
                        <span>👤</span>
                        Continue as Guest
                    </button>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input
                        type="text"
                        id="register-username"
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        minlength="3"
                    >
                    <div class="error-message" id="register-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                    <div class="error-message" id="register-email-error"></div>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <div class="error-message" id="register-password-error"></div>
                </div>

                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input
                        type="password"
                        id="register-confirm"
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                    >
                    <div class="error-message" id="register-confirm-error"></div>
                </div>

                <button type="submit" class="btn" id="register-btn">
                    <span id="register-btn-text">Create Account</span>
                </button>
            </form>

            <div class="footer">
                <a href="#" onclick="showInfo()">By continuing, you agree to our Terms of Service</a>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }

            // Clear errors
            clearErrors();
        }

        // Clear all errors
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(e => {
                e.textContent = '';
                e.classList.remove('show');
            });
        }

        // Show error
        function showError(fieldId, message) {
            const errorEl = document.getElementById(`${fieldId}-error`);
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Set loading state
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            const text = document.getElementById(`${btnId}-text`);

            if (loading) {
                btn.disabled = true;
                text.innerHTML = '<div class="loading"></div>';
            } else {
                btn.disabled = false;
                text.textContent = btnId === 'login-btn' ? 'Sign In' : 'Create Account';
            }
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username) {
                showError('login-username', 'Username is required');
                return;
            }

            if (!password) {
                showError('login-password', 'Password is required');
                return;
            }

            setLoading('login-btn', true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showToast('Login successful! Redirecting...');

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showError('login-username', data.detail || 'Invalid credentials');
                    showError('login-password', '');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Connection error. Please try again.', 'error');
            } finally {
                setLoading('login-btn', false);
            }
        }

        // Handle registration
        async function handleRegister(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            // Validation
            let hasError = false;

            if (username.length < 3) {
                showError('register-username', 'Username must be at least 3 characters');
                hasError = true;
            }

            if (!email.includes('@')) {
                showError('register-email', 'Please enter a valid email');
                hasError = true;
            }

            if (password.length < 6) {
                showError('register-password', 'Password must be at least 6 characters');
                hasError = true;
            }

            if (password !== confirm) {
                showError('register-confirm', 'Passwords do not match');
                hasError = true;
            }

            if (hasError) return;

            setLoading('register-btn', true);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Account created! Please log in.');

                    // Switch to login tab and fill username
                    switchTab('login');
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-password').focus();
                } else {
                    if (data.detail?.includes('username')) {
                        showError('register-username', 'Username already exists');
                    } else if (data.detail?.includes('email')) {
                        showError('register-email', 'Email already registered');
                    } else {
                        showError('register-username', data.detail || 'Registration failed');
                    }
                }
            } catch (error) {
                console.error('Registration error:', error);
                showToast('Connection error. Please try again.', 'error');
            } finally {
                setLoading('register-btn', false);
            }
        }

        // Guest login
        function guestLogin() {
            localStorage.setItem('user', JSON.stringify({ username: 'Guest', id: 'guest' }));
            showToast('Continuing as guest...');
            setTimeout(() => {
                window.location.href = '/';
            }, 500);
        }

        // Show info
        function showInfo() {
            showToast('Full terms will be available soon', 'success');
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            if (token && user) {
                // Already logged in, redirect to main app
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
