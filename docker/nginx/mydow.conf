## ─── Mydow PRD10 V1 nginx 反代 ───────────────────────────────────────────
##
## todo-tasks.md §11.1 + §11.3（Owner: Agent / my-mcp-20 @ 2026-05-06）
##
## ▍架构
##
##   ┌──────────┐   80/443    ┌────────────────┐   8000   ┌────────────┐
##   │  Client  │ ──────────► │  nginx (proxy) │ ──────► │  uvicorn   │
##   │ (browser)│             │  (this conf)   │          │  app:8000  │
##   └──────────┘             └────────────────┘          └────────────┘
##
## ▍核心路径分流（共享自 locations.conf.inc）
##
##   • /api/v1/*/stream    → SSE，proxy_buffering off + read_timeout 24h
##   • /(mydow|static)/*.* → 静态资源，hashed → immutable 1y / 其它 30d
##   • /(ws|api/.../ws)    → WebSocket upgrade
##   • /health  /ready     → 健康检查（无 access_log）
##   • /                   → 默认转发 FastAPI
##
## ▍HTTPS 启用
##
##   1. 生成证书（Let's Encrypt 推荐）：见 docs/11-deployment/https.md
##   2. 把证书放到 ./docker/nginx/ssl/{fullchain.pem,privkey.pem}
##   3. 设环境变量 MYDOW_DOMAIN=demo.mydow.example，重启：
##        docker compose -f docker-compose.prd10.yml --profile nginx restart nginx
##   4. HTTP server 自动 301 跳到 HTTPS。
##
## ▍开发模式（无证书）
##
##   保留 80 server 直接服务即可——HTTPS server 块在 ssl 文件存在时才有效。
##
## ──────────────────────────────────────────────────────────────────────────

upstream mydow_app {
    server app:8000;
    keepalive 32;
}

# Map: 是否真把 SPA 资源识别为 hashed/immutable（按文件名带 `.[hash]` 判断）
map $request_uri $is_hashed_asset {
    default                 0;
    "~*\.[a-f0-9]{8,}\..*$" 1;
}

# ─── 限流：登录 / AI / 搜索（PRD10 §29 风险表） ─────────────────────────────
# 统一在反代层做，作为应用层 §12.2 的辅助；阈值偏宽松防止演示翻车。
limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_zone:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=search_zone:10m rate=120r/m;

# ─── HTTP server (port 80) ────────────────────────────────────────────────
#   • 无证书：直接服务（dev / 内网部署）
#   • 有证书：自动 301 跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge passthrough（Let's Encrypt webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 当 HTTPS 证书可用时跳转
    if (-f /etc/nginx/ssl/fullchain.pem) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/locations.conf.inc;
}

# ─── HTTPS server (port 443) — 仅在证书存在时生效 ────────────────────────
# nginx 自身没有「条件 server 块」语法，所以这块默认就在；docker entrypoint
# 用 nginx -t 失败时会回退到无 SSL 模式（见 docker/nginx/entrypoint.sh）。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 证书（必填）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 现代化（Mozilla intermediate）
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session 复用
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # OCSP stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout        5s;

    # ─── HTTPS-only 安全头 ─────────────────────────────────────────────
    # HSTS：开启后浏览器会强制走 HTTPS 1 年；上线前先用 max-age=300 测，
    # 确认 HTTPS 链路稳定后再升到 31536000 + preload。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/locations.conf.inc;
}
