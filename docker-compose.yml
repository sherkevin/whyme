# Docker Compose for AgentOS
# Standard configuration with optional services
version: '3.8'

services:
  # Main AgentOS server
  agentos-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TYPE=standard
    image: agent-os:latest
    container_name: agent-os-core
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - AGENTOS_SANDBOX=docker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock  # Allow server to spawn sandbox containers
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - agentos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: agent-os-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - agentos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: PostgreSQL for production database
  postgres:
    image: postgres:16-alpine
    container_name: agent-os-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agentos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-agentos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentos-network
    restart: unless-stopped
    profiles:
      - postgres  # Use: docker-compose --profile postgres up

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: agent-os-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - agentos-server
    networks:
      - agentos-network
    restart: unless-stopped
    profiles:
      - nginx  # Use: docker-compose --profile nginx up

volumes:
  redis-data:
  postgres-data:

networks:
  agentos-network:
    driver: bridge
